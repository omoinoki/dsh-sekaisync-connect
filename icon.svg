<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SekaiSync Connect">
  <title>SekaiSync Connect</title>
  <!-- 世界计划知识库直连：书页（知识库）+ 声波（音乐/语音）+ 双向连线（connect） -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="#1b2a4a"/>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#39c5bb" stroke-width="2.5"/>
  <!-- 书页 -->
  <path d="M16 21h11a4 4 0 0 1 4 4v20a3 3 0 0 0-3-3H16z" fill="#39c5bb" opacity=".92"/>
  <path d="M48 21H37a4 4 0 0 0-4 4v20a3 3 0 0 1 3-3h12z" fill="#39c5bb" opacity=".62"/>
  <!-- 声波 -->
  <g stroke="#f4f7ff" stroke-width="2.2" stroke-linecap="round" opacity=".95">
    <path d="M24 30v8"/>
    <path d="M29 27v14"/>
    <path d="M34 31v6"/>
    <path d="M39 28v12"/>
  </g>
</svg>
